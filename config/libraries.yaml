libraries:

  fastapi:
    name: FastAPI
    repository: https://github.com/fastapi/fastapi.git
    branch: master
    type: github

    include:
      - "*.md"
      - "*.mdx"
      - "*.rst"
      - "*.py"

    exclude:
      - ".git"
      - "__pycache__"
      - ".github"
      - "tests"
      - "docs/en/data"
      - "docs/en/img"

    documentation_priority: high

  n8n:
    name: n8n
    repository: https://github.com/n8n-io/n8n.git
    branch: master
    type: github

    include:
      - "*.md"
      - "*.mdx"

    exclude:
      - ".git"
      - "node_modules"
      - "dist"
      - "packages/frontend/editor-ui/src/assets"

    documentation_priority: high

  docker:
    name: Docker
    repository: https://github.com/docker/docs.git
    branch: main
    type: github

    include:
      - "*.md"
      - "*.mdx"

    exclude:
      - ".git"

    documentation_priority: high

  python:
    name: Python
    repository: https://github.com/python/cpython.git
    branch: main
    type: github

    include:
      - "*.rst"
      - "*.md"

    exclude:
      - ".git"
      - "build"
      - "Tools"
      - "Lib/test"

    documentation_priority: high
